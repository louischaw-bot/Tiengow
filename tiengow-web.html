<script>
(function () {
  function portrait() { return window.innerHeight > window.innerWidth; }
  function sync() {
    document.documentElement.classList.toggle("preview-spin", portrait());
  }
  sync();
  window.addEventListener("resize", sync);
  window.addEventListener("orientationchange", sync);
  function lockLandscape() {
    try {
      var o = screen.orientation;
      if (o && o.lock) o.lock("landscape").catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("touchstart", lockLandscape, { once: true });
  document.addEventListener("click", lockLandscape, { once: true });
})();
document.addEventListener("DOMContentLoaded", function () {
  var stage = document.getElementById("spinStage");
  if (!stage) {
    stage = document.createElement("div");
    stage.id = "spinStage";
    while (document.body.firstChild) stage.appendChild(document.body.firstChild);
    document.body.appendChild(stage);
  }
  stage.addEventListener("wheel", function (e) {
    var dy = e.deltaY || e.deltaX || 0;
    if (stage.scrollWidth > stage.clientWidth + 4) stage.scrollLeft -= dy;
    else stage.scrollTop += dy;
    e.preventDefault();
  }, { passive: false });
  var ly = 0;
  stage.addEventListener("touchstart", function (e) {
    ly = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    var y = e.touches[0].clientY;
    var dy = y - ly;
    ly = y;
    if (stage.scrollWidth > stage.clientWidth + 4) stage.scrollLeft += dy;
    else stage.scrollTop -= dy;
    e.preventDefault();
  }, { passive: false });
});
</script>

function playDuanZhuangFanfare() {
  startHomeBgm();
  if (state.sfxMuted) return;
  try {
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    const burst = (t, f, dur, type) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur);
    };
    burst(now, 880, 0.18, "sawtooth");
    burst(now + 0.12, 1174, 0.2, "square");
    burst(now + 0.28, 1568, 0.35, "sawtooth");
    burst(now + 0.18, 200, 0.5, "triangle");
  } catch (e) {}
  setTimeout(() => speakLine("Yeah！斷莊！歡呼！"), 80);

function speakLine(text) {
  if (!text || state.sfxMuted) return;
  try {
    const syn = window.speechSynthesis;
    if (!syn) return;
    syn.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "zh-HK";
    u.rate = 1.05;
    u.volume = Math.max(0.2, Math.min(1, state.sfxVol || 0.85));
    const pick = () => {
      const vs = syn.getVoices() || [];
      return vs.find(v => /zh-HK|Yue|yue|Cantonese/i.test((v.lang||"")+(v.name||"")))

        || vs.find(v => /^zh/i.test(v.lang||""));

const voice = { id: Math.random().toString(36).slice(2, 8), pcs: {}, seen: {}, remotes: {}, stream: null, ctx: null, gain: null, timer: null, since: 0, bc: null };
function voiceRoom() { return String(state.roomCode || "table").slice(0, 16); }
function hangupVoice() {
  state.voiceOn = false;
  if (voice.timer) { clearInterval(voice.timer); voice.timer = null; }
  Object.keys(voice.pcs).forEach(k => { try { voice.pcs[k].close(); } catch (e) {} });
  voice.pcs = {};

function setVoiceVol(v) {

function ensureVoiceOut() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!voice.ctx) voice.ctx = new Ctx();
  if (voice.ctx.state === "suspended") voice.ctx.resume();
  if (!voice.gain) {
    voice.gain = voice.ctx.createGain();
    voice.gain.connect(voice.ctx.destination);
  }
  voice.gain.gain.value = state.voiceVol == null ? 0.8 : state.voiceVol;
}
function playRemoteVoice(stream, from) {
  if (!stream || voice.remotes[from] || !voice.ctx) return;
  try {
    const src = voice.ctx.createMediaStreamSource(stream);

function makeVoicePc(other) {
  if (voice.pcs[other]) return voice.pcs[other];
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  voice.pcs[other] = pc;
  if (voice.stream) voice.stream.getTracks().forEach(t => pc.addTrack(t, voice.stream));
  pc.onicecandidate = (e) => { if (e.candidate) sendVoice({ type: "ice", to: other, candidate: e.candidate }); };
  pc.ontrack = (e) => playRemoteVoice(e.streams && e.streams[0], other);

}
function sendVoice(msg) {
  const body = Object.assign({ room: voiceRoom(), from: voice.id, nid: voice.id + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6) }, msg);
  if (voice.seen) voice.seen[body.nid] = 1;
  if (voice.bc) { try { voice.bc.postMessage(body); } catch (e) {} }
  fetch("/api/voice?room=" + encodeURIComponent(body.room), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body)
  }).catch(() => {});
}
async function onVoiceMsg(msg) {
  if (!state.voiceOn || !msg || msg.from === voice.id || msg.room !== voiceRoom()) return;
  if (msg.nid && voice.seen[msg.nid]) return;
  if (msg.nid) voice.seen[msg.nid] = 1;
  if (msg.to && msg.to !== voice.id) return;
  if (msg.type === "hello") {
    if (!msg.to) sendVoice({ type: "hello", to: msg.from });
    if (voice.id < msg.from) {
      const pc = makeVoicePc(msg.from);
      if (pc.signalingState === "stable" && !pc.localDescription) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendVoice({ type: "offer", to: msg.from, sdp: pc.localDescription });
      }
    }
    return;
  }
  if (msg.type === "offer") {
    const pc = makeVoicePc(msg.from);
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendVoice({ type: "answer", to: msg.from, sdp: pc.localDescription });
    return;
  }
  if (msg.type === "answer" && voice.pcs[msg.from]) {
    if (!voice.pcs[msg.from].currentRemoteDescription) await voice.pcs[msg.from].setRemoteDescription(msg.sdp);
    return;
  }
  if (msg.type === "ice" && msg.candidate && voice.pcs[msg.from]) {
    try { await voice.pcs[msg.from].addIceCandidate(msg.candidate); } catch (e) {}
  }
}

  if (!voice.bc && window.BroadcastChannel) {
    voice.bc = new BroadcastChannel("tiengow-voice");
    voice.bc.onmessage = (e) => { onVoiceMsg(e.data); };
  }
  if (voice.timer) clearInterval(voice.timer);
  const pull = () => {
    if (!state.voiceOn) return;
    fetch("/api/voice?room=" + encodeURIComponent(voiceRoom()) + "&since=" + voice.since)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        const msgs = data && data.msgs || [];
        msgs.forEach(m => { if (m.id && m.id > voice.since) voice.since = m.id; onVoiceMsg(m); });
      }).catch(() => {});
  };
  pull();
  voice.timer = setInterval(pull, 1000);
}

  state._autoT = setTimeout(() => {

        <button class="btn" ${n<=1?"disabled":""} onclick="state.lesson=${n-1};render()">上一課</button>
        <button class="btn primary" ${n>=6?"disabled":""} onclick="state.lesson=${n+1};render()">下一課</button>

      </div>

  }
  if (state.screen === "rules") {

      <div class="rule-card"><div class="name">天九 · 點樣出牌</div><p>四人各八張，莊家先出，出牌逆時針；新一局掉轉方向。可出 1–4 張：單張、文對、武對、文武對、三張組、四張組、至尊。其餘三家要出同樣張數；同類更大就可以鬥大翻面，否則蓋牌墊牌。文子只可以壓文子，武子只可以壓武子。四家出完，最大嗰組收嗰磴，再由佢領下一磴。</p></div>

      <div class="panel">

          <div class="name">${state.names[bnk]} · 莊</div>

          return `<div class="show-seat">
            <div class="name">${state.names[j.i]}</div>

        }).join("")}
      </div>
      <div class="row">
        <button class="btn primary" onclick="advancePgShow()">${step < 2 ? "下一手" : "看結算"}</button>
        <button class="btn exit-btn" onclick="state.confirmExit=true;render()">退出遊戲</button>
      </div>
      ${exitOverlay()}`;
    return;
  }
  if (state.screen === "paigow") {
    renderPaigow(app);
    return;
  }

  const m = state.match;
  const versus = state.mode === "versus";
  const actor = localPlayer();
  if (versus && !state.passReady && isHuman(actor) && state.humans.filter(Boolean).length > 1 && !m.awaitingNextRound && !m.finished) {
    app.innerHTML = `
      ${gameChrome("天九 · 多人對戰", `<div class="meta">傳機給下一位</div>`)}
      <div class="pass">
        <h2>請把畫面交給 ${state.names[actor]}</h2>
        <p class="meta">手牌先收埋。下面仲可以睇已翻面嘅牌，墊牌繼續蓋住。</p>
        <button class="btn primary" onclick="state.passReady=true;render()">我是${state.names[actor]} · 開始出牌</button>
        <div class="row"><button class="btn exit-btn" onclick="state.confirmExit=true;render()">退出遊戲</button></div>
      </div>
      ${openedBoard(m)}
      ${exitOverlay()}`;
    return;
  }
  const hand = sortTiles(m.hands[actor]);
  const selected = hand.filter(t => state.selectedIds.includes(t.id));
  const selectedPlay = evaluatePlay(selected, actor);
  const canLead = !m.highPlay && Boolean(selectedPlay);
  const canRaise = Boolean(m.highPlay && selectedPlay && canBeat(selectedPlay, m.highPlay));
  const msg = state.message || getSelectionMessage(selected, m.highPlay);
  const humanTurn = versus || m.currentPlayer === 0;
  const ref = state.showRef ? `
    <div class="overlay" onclick="if(event.target===this){state.showRef=false;render()}">
      <div class="modal">
        <div class="topbar"><strong>已開牌參考</strong><button onclick="state.showRef=false;render()">關閉</button></div>
        ${m.trickHistory.length===0 ? "<p>暫時未有已完成的磴。</p>" :
          m.trickHistory.slice().reverse().map(tr => `<div class="rule-card"><div class="name">第 ${tr.number} 磴 · ${state.names[tr.winner]} 收 ${tr.count} 戙</div>
          <div class="trick-grid">${tr.plays.map((p,i)=>playGroup(p, state.names[i])).join("")}</div></div>`).join("")}
      </div>
    </div>` : "";

  app.innerHTML = `
    ${gameChrome(versus ? "天九 · 多人對戰" : "天九 · 單人教學", `<div class="meta">第 ${m.trickNumber} 磴 · ${(m.dir||state.playDir||-1)<0?"逆時針":"順時針"} · ${state.names[bankerSeat()]} ♛第${bankerExtra()+1}莊 ×${bankerMult()}</div>`)}
    ${currentTrickTableHTML(m)}
    <div class="hand-box${m.currentPlayer===actor?" active seat":""}">
      <div class="hand-hud">${hand.length}張　食${m.collectedTiles[actor]/4}棟</div>
      <div class="dock-actions play-main">
        <button class="btn primary play-btn" ${m.highPlay ? (!canRaise?"disabled":"") : (!canLead?"disabled":"")} onclick="submitAction(false)">${m.highPlay ? "鬥大出牌" : "出牌領磴"}</button>
        <button class="btn pad-btn" ${m.highPlay ? "" : "disabled"} onclick="submitAction(true)">${m.highPlay ? `墊 ${m.highPlay.count} 張` : "墊牌"}</button>
        <button class="btn clear-btn" onclick="state.selectedIds=[];render()">重新選牌</button>
        ${!m.finished ? `<div class="btn next-pack"><button type="button" ${m.awaitingNextRound?"":"disabled"} onclick="continueAfterReview()">下一輪</button><button type="button" class="${state.autoNext?"on":""}" onclick="toggleAutoNext()">自動</button></div>` : ""}
        ${m.awaitingNextRound && m.finished ? `<button class="btn primary" onclick="continueAfterReview()">查看本局結果</button>` : ""}
      </div>
      <div class="meta" style="text-align:center">自己手牌只有你睇到 · 打出先公開 · 墊牌冚住</div>
      <div class="hand-fan">${hand.map(t => tileHTML(t, { selected: state.selectedIds.includes(t.id), clickable: m.currentPlayer===actor && !m.awaitingNextRound && !m.finished })).join("")}</div>
      <div class="status">${m.heZunFlash ? m.heZunFlash+"　" : ""}${humanTurn && !m.awaitingNextRound ? msg : (m.awaitingNextRound ? "請查看本磴結算" : "電腦對手正在出牌…")}</div>
      ${!m.awaitingNextRound && !m.finished && !isHuman(m.currentPlayer) ? `<div id="turnClock" class="turn-clock">20s</div>` : ""}
      ${versus ? `<div class="meta">${state.names.map((n,i)=>`${n}${state.disconnected[i]?" 斷線代打":state.hosted[i]?" 托管":""}`).join(" · ")}</div>
      <div class="row">${state.humans.map((h,i)=>h? (state.disconnected[i]?`<button class="btn" onclick="simulateReconnect(${i})">${state.names[i]}接返</button>`:`<button class="btn" onclick="simulateDisconnect(${i})">${state.names[i]}模擬斷線</button>`):"").join("")}</div>`:""}
      <div class="dock-actions">
        ${humanTurn && !m.awaitingNextRound ? `<button class="btn" onclick="pauseForCoach()">暫停教學</button>` : ""}
        ${humanTurn && !m.awaitingNextRound ? `<button class="btn" onclick="requestComputerPlay()">電腦代打</button>` : ""}
        <button class="btn" onclick="hintPlay()" ${humanTurn && !m.awaitingNextRound ? "" : "disabled"}>提示</button>
        <button class="btn opened-btn" onclick="state.showRef=true;render()">已開牌（${m.trickHistory.length}）</button>
        <button class="btn exit-btn" onclick="state.confirmExit=true;render()">退出遊戲</button>
      </div>
    </div>
    ${ref}${state.paused && humanTurn ? coachPanel(m) : ""}${exitOverlay()}`;
    if (!state.paused) startTurnClock();
}

function confirmExit() {
  state.confirmExit = false;
  state.screen = "home";
  state.passReady = true;
  state.selectedIds = [];
  state.showRef = false;
  render();
}
function pgSeatLabels(n) {
  const base = ["莊家","閒一","閒二","閒三","閒四","閒五","閒六","閒七"];
  return base.slice(0, n);
}
function setPgPlayers(n) {
  state.pgPlayers = n;
  const labels = pgSeatLabels(n);
  const old = state.names || [];
  state.names = labels.map((lab, i) => (old[i] && old[i] !== pgSeatLabels(8)[i] ? old[i] : lab));
  render();
}
function backToLobby() {
  stopWaitTick();
  state.confirmExit = false;
  state.passReady = true;
  state.selectedIds = [];
  state.showRef = false;
  state.screen = "lobby";
  render();
}
function openLobby(game, mode) {
  state.game = game;
  state.mode = mode;
  if (game === "tiengow") {
    state.names = mode === "versus" ? ["座位一","西家","北家","東家"] : ["你","西家","北家","東家"];
    state.firstHandDone = false;
    state.lastDice = null;
    state.paiTou = "左開";
    state.bankerExtra = 0;
    state.shoeDeck = [];
  } else if (mode === "versus") {
    state.firstHandDone = false;
    state.shoeDeck = [];
    if (![2,4,8].includes(state.pgPlayers)) state.pgPlayers = 4;
    state.names = pgSeatLabels(state.pgPlayers);
  } else {
    state.names = ["電腦莊家","你，玩家"];
  }
  if (mode === "versus") {
    state.waitSec = state.waitSec || 30;
    if (game === "tiengow") {
      state.names = ["你（玩家）","電腦甲","電腦乙","電腦丙"];
      if (typeof assignWinds === "function") assignWinds();
    }
    const n = state.names.length;
    state.humans = Array.from({length:n}, (_,i)=> i===0);
    state.readySeats = Array.from({length:n}, (_,i)=> i===0);
    state.hosted = Array.from({length:n}, ()=>false);
    state.disconnected = Array.from({length:n}, ()=>false);
    state.netTables = [];
    state.netTablesOk = false;
    state.screen = "lobby";
    render();
    return;
  }
  state.screen = "lobby";
  render();
}
function netTablesHTML() {
  const game = state.game || "tiengow";
  const label = game === "paigow" ? "牌九" : "天九";
  const list = (state.netTables || []).filter(t => t.game === game);
  const head = state.netTablesOk
    ? ("網絡上有 " + list.length + " 張" + label + "枱")
    : ("正在查看網絡枱面…" + (list.length ? ("本機見到 " + list.length + " 張") : ""));
  const rows = list.map(t => {
    const seats = t.seats || 4;
    const filled = t.filled || 0;
    const open = filled < seats;
    const code = String(t.code || "").replace(/[^0-9A-Za-z]/g, "");
    return '<div class="seat-row"><div><div class="name">枱 ' + code + '</div><div class="meta">' + filled + "/" + seats + " 人" + (open ? " · 有空位" : " · 已滿") + '</div></div><button class="btn" ' + (open ? "" : "disabled") + ' onclick="joinNetTable(\'' + code + '\')">' + (open ? "入座" : "已滿") + "</button></div>";
  }).join("");
  return '<div class="name">' + head + '</div>' + (rows || '<p class="meta">未有人開枱。撳開新枱，網絡上嘅人就會見到。</p>');
}
function paintNetTables() {
  const box = document.getElementById("netTables");
  if (box) box.innerHTML = netTablesHTML();
}
function readLocalTables(game) {
  try {
    const all = JSON.parse(localStorage.getItem("tiengow-tables") || "[]");
    return all.filter(t => t && t.game === game && Date.now() - t.at < 20000);
  } catch (e) { return []; }
}
function writeLocalTable(row, leave) {
  try {
    const all = JSON.parse(localStorage.getItem("tiengow-tables") || "[]").filter(t => t && Date.now() - t.at < 20000);
    const key = row.game + ":" + row.code;
    const next = all.filter(t => (t.game + ":" + t.code) !== key);
    if (!leave) next.push(Object.assign({}, row, { at: Date.now() }));
    localStorage.setItem("tiengow-tables", JSON.stringify(next));
  } catch (e) {}
}
function refreshNetTables() {
  const game = state.game || "tiengow";
  fetch("/api/tables?game=" + encodeURIComponent(game))
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      state.netTables = data.tables || [];
      state.netTablesOk = true;
      paintNetTables();
    })
    .catch(() => {
      state.netTablesOk = false;
      state.netTables = readLocalTables(game);
      paintNetTables();
    });
}
function startNetTableWatch() {
  refreshNetTables();
  if (state._netWatch) return;
  state._netWatch = setInterval(() => {
    if (state.screen !== "lobby" || state.mode !== "versus") { stopNetTableWatch(); return; }
    refreshNetTables();
  }, 2000);
}
function stopNetTableWatch() {
  if (state._netWatch) { clearInterval(state._netWatch); state._netWatch = null; }
}
function tableRow() {
  return {
    code: String(state.roomCode || "").replace(/[^0-9A-Za-z]/g, "").slice(0, 8),
    game: state.game === "paigow" ? "paigow" : "tiengow",
    seats: (state.names || []).length || 4,
    filled: (state.humans || []).filter(Boolean).length || 1
  };
}
function beatTable() {
  if (state.mode !== "versus" || !state.roomCode) return;
  if (!["waiting","game","paigow","paitou","deal","result","pg-result","pg-showdown"].includes(state.screen)) return;
  const row = tableRow();
  if (!row.code) return;
  writeLocalTable(row, false);
  fetch("/api/tables", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(row) }).catch(() => {});
}
function leaveTable() {
  if (!state.roomCode) return;
  const row = tableRow();
  writeLocalTable(row, true);
  fetch("/api/tables", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ leave: true }, row)) }).catch(() => {});
}
function startTableBeat() {
  beatTable();
  if (state._tableBeat) clearInterval(state._tableBeat);
  state._tableBeat = setInterval(beatTable, 4000);

    ? `牌頭「${state.paiTou}」· ${state.names[lead]} 做莊先出 · 方向${(state.playDir||-1)<0?"逆時針":"順時針"}。`
    : `你是首局莊家。方向${(state.playDir||-1)<0?"逆時針":"順時針"}。選擇一至四張可成組牌作領牌。`;
  state.showRef = false;
  state.confirmExit = false;
  state.passReady = !(state.mode === "versus" && isHuman(state.match.currentPlayer) && state.humans.filter(Boolean).length > 1);
  state.screen = "game";
  render();
}
function nextTiengowHand() {
  state.playDir = -(state.playDir || -1);
  if (state.match && state.match.finalWinner != null) {
    applyBankerStreak(state.match.finalWinner);
  }
  state.firstHandDone = true;
  if (state.game === "tiengow") {
    if (state.newbie || shouldAutoPlay()) startTiengow();
    else openPaiTou();
    return;
  }
  startTiengow();
}
function nextPaigowHand(freshPack) {
  if (freshPack) {
    state.shoeDeck = [];
    state.usedShoeWall = false;
    state.usedTiles = [];
  }
  if (state.mode === "versus" && state.pg) {
    const winnerVsBanker = (state.pg.judges || []).find(j => j.result === "win");
    const nextB = winnerVsBanker ? winnerVsBanker.i : (state.pg.banker || 0);
    applyBankerStreak(nextB);
    state.firstHandDone = true;
    openPaiTou();
    return;
  }
  startPaigow(false);
}
function startGame() { startTiengow(); }
function startPaigow(fromLobby) {
  const n = state.mode === "versus" ? Math.max(2, state.names.length) : 2;
  const keepScores = !fromLobby && state.pg && state.pg.scores && state.pg.scores.length === n;
  const presetOk = state.mode === "versus" && handsComplete();
  let dealt;
  const prevHands = state.pg && state.pg.hands;
  if (fromLobby && state.mode === "solo") {
    state.shoeDeck = [];
    state.shoeRound = 0;
    state.usedTiles = [];
  }
  if (presetOk) {
    const leftover = leftoverFromWall(state.wallNow || []);
    dealt = { hands: state.dealHands.map(h => h.slice(0, 4)), leftover, reshuffled: !state.usedShoeWall };
    state.firstHandDone = true;
  } else {
    const forceShuffle = !state.shoeMode;
    dealt = dealPgHands(n, {
      deck: forceShuffle ? [] : (state.shoeDeck || []),
      forceShuffle
    });
  }
  state.shoeDeck = dealt.leftover;
  if (dealt.reshuffled) state.usedTiles = [];
  else if (prevHands) state.usedTiles = (state.usedTiles || []).concat(prevHands.flat());
  state.shoeRound = dealt.reshuffled ? 1 : (state.shoeRound || 0) + 1;
  state.pg = {
    hands: dealt.hands,
    banker: state.mode === "versus" ? (state.bankerIndex || 0) : 0,
    turn: state.mode === "versus" ? 0 : 1,
    scores: (keepScores || (fromLobby && state.firstHandDone && state.pg && state.pg.scores && state.pg.scores.length === n)) ? state.pg.scores : Array(n).fill(0),
    selected: [],
    splits: Array(n).fill(null),
    revealed: false,
    lastText: "",
    phase: "set",
    leftover: dealt.leftover.length,
    reshuffled: dealt.reshuffled,
    playerCount: n
  };
  if (state.mode === "solo") {
    state.pg.splits[0] = bestSplit(dealt.hands[0]);
  } else {
    state.pg.splits = dealt.hands.map((hand, i) => isHuman(i) ? null : bestSplit(hand));
    let turn = 0;
    while (turn < n && state.pg.splits[turn]) turn++;
    state.pg.turn = turn < n ? turn : 0;
  }
  const multiHuman = state.humans.filter(Boolean).length > 1;
  state.passReady = !(state.mode === "versus" && multiHuman && isHuman(state.pg.turn));
  state.confirmExit = false;
  state.screen = "paigow";
  render();
}
function selectTile(id) {
  const m = state.match;
  const actor = localPlayer();
  if (m.currentPlayer !== actor || m.finished || m.awaitingNextRound) return;
  const cur = state.selectedIds;
  if (cur.includes(id)) state.selectedIds = cur.filter(x => x !== id);
  else {
    const max = m.highPlay?.count ?? 4;
    state.selectedIds = cur.length >= max ? [id] : [...cur, id];
  }
  const tiles = m.hands[actor].filter(x => state.selectedIds.includes(x.id));
  state.message = getSelectionMessage(tiles, m.highPlay);
  render();
}
function submitAction(discard) {
  try {
    const actor = localPlayer();
    if (state.match.currentPlayer !== actor) return;
    let next = applyAction(state.match, actor, state.selectedIds, discard);
    announcePlay(next.plays[actor] || next.highPlay);
    if (next.awaitingNextRound) playWinSfx();
    stopTurnClock();
    if (state.timeoutStreak && state.timeoutStreak[actor] != null) state.timeoutStreak[actor] = 0;
    state.match = next;
    state.selectedIds = [];
    state.passReady = false;
    if (next.awaitingNextRound) {
      const won = next.lastTrick && next.lastTrick.plays ? next.lastTrick.plays[next.lastTrick.winner] : null;
      state.message = won
        ? `${state.names[next.lastTrick.winner]}以${won.label || "呢手"}吃得第 ${next.lastTrick.number} 磴。`
        : "本磴完結。";
      if (next.handVoid) state.message += " 空棟唔算正式結牌。";
      state.passReady = true;
    } else {
      state.message = "輪到下一位。";
    }
    render();
  } catch (e) {
    state.message = e.message || "未能出牌";
    render();
  }
}
function continueAfterReview() {
  try {
    if (state.match.finished) {
      if (state.screen !== "result") {
        const pts = teachingScore(state.match);
        state.scores = state.scores.map((s,i) => s + (pts[i] ? pts[i].total : 0));
        if (typeof logHandSummary === "function") logHandSummary();
        state.screen = "result";
      }
      state.match.awaitingNextRound = false;
      render();
      return;
    }
    let next = beginNextRound(state.match);
    state.match = next;
    state.selectedIds = [];
    state.passReady = !(state.humans.filter(Boolean).length > 1 && isHuman(next.currentPlayer));
    state.message = `輪到 ${state.names[next.currentPlayer]} 出牌。`;
    render();
  } catch (e) {
    state.message = e.message;
    render();
  }
}
function pgSelect(id) {
  const pg = state.pg;
  const i = pg.turn;
  if (pg.splits[i]) return;
  const cur = pg.selected;
  pg.selected = cur.includes(id) ? cur.filter(x => x !== id) : (cur.length >= 2 ? [id] : [...cur, id]);
  render();
}
function pgConfirmSplit() {
  stopTurnClock();
  const actor = state.pg && state.pg.turn;
  if (actor!=null && state.timeoutStreak) state.timeoutStreak[actor]=0;
  const pg = state.pg;
  const i = pg.turn;
  const hand = pg.hands[i];
  if (pg.selected.length !== 2) { alert("請先選兩張做後手（較大嗰對）。"); return; }
  const high = hand.filter(t => pg.selected.includes(t.id));
  const low = hand.filter(t => !pg.selected.includes(t.id));
  if (high.length !== 2 || low.length !== 2) return;
  const split = { high: evaluatePgHand(high), low: evaluatePgHand(low) };
  if (split.low.strength > split.high.strength) {
    alert("前手唔可以大過後手。你揀嘅「後手」細過前手，請改選較大嗰對做後手。");
    return;
  }
  playSlapSound(0);
  pg.splits[i] = split;
  pg.selected = [];
  if (state.mode === "solo") {
    startPgShowdown();
    return;
  } else {
    if (!pg.splits.every(Boolean)) {
      let next = (i + 1) % pg.hands.length;
      while (pg.splits[next] && next !== i) next = (next + 1) % pg.hands.length;
      pg.turn = next;
      state.passReady = !(state.humans.filter(Boolean).length > 1);
    }
    if (pg.splits.every(Boolean)) {
      startPgShowdown();
      return;
    }
  }
  render();
}
function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!state.audioCtx) state.audioCtx = new Ctx();
  if (state.audioCtx.state === "suspended") state.audioCtx.resume();
  return state.audioCtx;
}
function playWoodClickSynth(vol, retried) {
  const ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === "suspended" && !retried) { ctx.resume().then(() => playWoodClickSynth(vol, true)); return; }
  const t0 = ctx.currentTime;
  const len = Math.floor(ctx.sampleRate * 0.08);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.012));
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 1400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol || 0.55, t0);
  g.gain.exponentialRampToValueAtTime(0.01, t0 + 0.07);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 0.08);
  const osc = ctx.createOscillator();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(180, t0);
  osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.06);
  const og = ctx.createGain();
  og.gain.setValueAtTime((vol || 0.55) * 0.35, t0);
  og.gain.exponentialRampToValueAtTime(0.01, t0 + 0.07);
  osc.connect(og); og.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + 0.07);
}
function playDiceRattleSynth() {
  const ctx = ensureAudio();
  if (!ctx) return;
  let n = 0;
  const id = setInterval(() => {
    playWoodClick(0.25 + Math.random() * 0.25);
    n++;
    if (n >= 6) clearInterval(id);
  }, 150);
}
function playSlapSoundSynth(delay, retried) {
  const ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === "suspended" && !retried) { ctx.resume().then(() => playSlapSoundSynth(delay, true)); return; }
  const t0 = ctx.currentTime + (delay || 0);
  const len = Math.floor(ctx.sampleRate * 0.22);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.exp(-i / (ctx.sampleRate * 0.04));
    data[i] = (Math.random() * 2 - 1) * env;
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const low = ctx.createBiquadFilter();
  low.type = "lowpass";
  low.frequency.value = 900;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(1.4, t0);
  ng.gain.exponentialRampToValueAtTime(0.01, t0 + 0.2);
  noise.connect(low); low.connect(ng); ng.connect(ctx.destination);
  noise.start(t0); noise.stop(t0 + 0.22);
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(90, t0);
  osc.frequency.exponentialRampToValueAtTime(32, t0 + 0.16);
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.7, t0);
  og.gain.exponentialRampToValueAtTime(0.01, t0 + 0.18);
  osc.connect(og); og.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + 0.18);
  const click = ctx.createOscillator();
  click.type = "square";
  click.frequency.setValueAtTime(220, t0);
  click.frequency.exponentialRampToValueAtTime(70, t0 + 0.05);
  const cg = ctx.createGain();
  cg.gain.setValueAtTime(0.18, t0);
  cg.gain.exponentialRampToValueAtTime(0.01, t0 + 0.06);
  click.connect(cg); cg.connect(ctx.destination);
  click.start(t0); click.stop(t0 + 0.06);
}
function showdownAudio(step) {
  if (step === 0 || step === 1) announcePgStep(step);
}
function startPgShowdown() {
  const pg = state.pg;
  pg.revealed = true;
  pg.showStep = 0;
  pg.judges = [];
  const bnk = pg.banker || 0;
  for (let p = 0; p < pg.hands.length; p++) {
    if (p === bnk) continue;
    pg.judges.push({ i: p, ...judgePg(pg.splits[p], pg.splits[bnk]) });
  }
  if (state.pgShowTimer) clearTimeout(state.pgShowTimer);
  state.screen = "pg-showdown";
  render();
  showdownAudio(0);
  state.pgShowTimer = setTimeout(advancePgShow, 2000);
}
function advancePgShow() {
  if (state.pgShowTimer) { clearTimeout(state.pgShowTimer); state.pgShowTimer = null; }
  if (!state.pg || state.screen !== "pg-showdown") return;
  const pg = state.pg;
  pg.showStep = (pg.showStep || 0) + 1;
  if (pg.showStep >= 3) {
    let text = [];
    pg.judges.forEach(j => {
      const m = pgStake();
      const b = pg.banker || 0;
      pg.scores[j.i] += j.delta * m;
      pg.scores[b] -= j.delta * m;
      text.push(`${state.names[j.i]} ${j.text}`);
    });
    pg.lastText = text.join("　");
    if (pg.judges[0]) state.pgScores[0] += pg.judges[0].delta;
    state.screen = "pg-result";
    render();
    return;
  }
  render();
  showdownAudio(pg.showStep);
  state.pgShowTimer = setTimeout(advancePgShow, 2000);
}

function pgCompareBlock(j, pg) {
  const b = pg.banker || 0;
  const idle = pg.splits[j.i];
  const bank = pg.splits[b];
  if (!idle || !bank) return "";
  const row = (title, a, bhand, win) => `
    <div class="lane">
      <div class="side">
        <div class="meta">${state.names[j.i]} · ${title}</div>
        <div class="tiles">${pairTilesHTML(a, false)}</div>
        <div class="mark">${a.label||""} · ${win===1?"勝":"負"}</div>
      </div>
      <div class="vs">對</div>
      <div class="side">
        <div class="meta">${state.names[b]} · 莊 · ${title}</div>
        <div class="tiles">${pairTilesHTML(bhand, false)}</div>
        <div class="mark">${bhand.label||""}</div>
      </div>
    </div>`;
  return `<div class="pg-vs">
    <div class="name">${state.names[j.i]} 對莊　${j.text}　${j.delta>0?"+":""}${j.delta * pgStake()}</div>
    ${row("前手", idle.low, bank.low, j.lo)}
    ${row("後手", idle.high, bank.high, j.hi)}
  </div>`;
}

function usedTilesBoard() {
  const used = state.usedTiles || [];
  if (!used.length || !state.shoeMode) return "";
  return `<div class="panel" style="margin-top:8px">
    <div class="name">已打出（${used.length} 張）· 唔按出牌次序</div>
    <p class="meta">同一副剩牌續鋪，已用過嘅牌攤開俾大家睇。</p>
    <div class="tiles" style="flex-wrap:wrap">${used.map(t => tileHTML(t, { compact: true })).join("")}</div>
  </div>`;
}
function pairTilesHTML(hand, slap) {
  if (!hand) return "";
  return hand.tiles.map((t, idx) => tileHTML(t, { slap: slap ? (idx ? "slap2" : "slap") : "" })).join("");
}
function pgCovered(n) {
  return Array.from({length: n}, () => `<div class="tile compact"></div>`).join("");
}
function renderPaigow(app) {
  const pg = state.pg;
  const versus = state.mode === "versus";
  const i = versus ? pg.turn : 1;
  if (versus && !state.passReady && isHuman(i) && state.humans.filter(Boolean).length > 1 && !pg.splits[i]) {
    app.innerHTML = `${gameChrome("牌九 · 多人對戰")}<div class="pass">
      <h2>請把畫面交給 ${state.names[i]}</h2>
      <button class="btn primary" onclick="state.passReady=true;render()">我是${state.names[i]} · 開始配牌</button>
      <div class="row"><button class="btn exit-btn" onclick="state.confirmExit=true;render()">退出遊戲</button></div>
    </div>${exitOverlay()}`;
    return;
  }
  const hand = versus ? pg.hands[i] : pg.hands[1];
  const title = versus ? "牌九 · 多人對戰" : "牌九 · 單人教學";
  const n = pg.playerCount || pg.hands.length;
  const b = pg.banker || 0;
  const others = [...Array(n).keys()].filter(x => x !== b);
  const mid = Math.ceil(others.length / 2);
  const left = others.slice(0, mid);
  const right = others.slice(mid);
  const seat = (idx, cover) => {
    if (idx == null) return "";
    const me = idx === i;
    return `<div class="bacc-seat ${me?"on":""}">
      <div class="who">${state.names[idx]||""}${idx===b?" · 莊":""}${pg.splits[idx]?" ✓":""}</div>
      <div class="tiles">${me ? "" : pgCovered(4)}</div>
    </div>`;
  };
  app.innerHTML = `
    ${gameChrome(title, `<div class="meta">${n}人 · ${versus ? state.names[i]+" 配牌" : "你（閒家）　對　電腦莊家"}</div>`)}
    <div class="bacc">
      <div class="bacc-row">${seat(b, true)}</div>
      <div class="bacc-row">${left.map(x => seat(x, true)).join("")}<div style="flex:1"></div>${right.map(x => seat(x, true)).join("")}</div>
    </div>
    <p class="meta" style="margin:8px 6px 12px">計分：莊家一個人對所有閒家，閒家之間唔對打。揀兩張做後手，前手唔可以大過後手。${state.shoeMode ? "牌牆剩 "+(state.shoeDeck||[]).length+" 張。" : ""}</p>
    ${usedTilesBoard()}
    ${!isHuman(i) && pg && !pg.splits[i] ? `<div id="turnClock" class="turn-clock">20s</div>` : ""}
    ${versus ? `<div class="meta">${state.names.map((n,k)=>`${n}${state.disconnected[k]?" 斷線代打":state.hosted[k]?" 托管":""}`).join(" · ")}</div>`:""}
    <div class="hand-box">
      <div class="name">${versus?state.names[i]:state.names[i]||"你（閒家）"} · 畫面下方出牌</div>
      <div class="tiles" style="margin:12px 0">${hand.map(t => tileHTML(t, { selected: pg.selected.includes(t.id), clickable: true })).join("")}</div>
      <div class="dock-actions">
        <button class="btn primary" onclick="pgConfirmSplit()">選擇兩隻做後手</button>
        <button class="btn" onclick="state.pg.selected=[];render()">重選</button>
        ${isHuman(i) ? `<button class="btn" onclick="requestComputerPlay()">電腦代打</button>` : ""}
        <button class="btn exit-btn" onclick="state.confirmExit=true;render()">退出遊戲</button>
      </div>
    </div>${exitOverlay()}`;
    startTurnClock();
}
render();
</script>
